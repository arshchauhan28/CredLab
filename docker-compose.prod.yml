version: "3.8"

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-credlab_db}
      POSTGRES_USER: ${POSTGRES_USER:-credlab_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-credlab_secure_password_here}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-credlab_user} -d ${POSTGRES_DB:-credlab_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      API_V1_STR: /api
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-credlab_user}:${POSTGRES_PASSWORD:-credlab_secure_password_here}@db:5432/${POSTGRES_DB:-credlab_db}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-generate_with_openssl_rand_hex_32}
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 60
      JUDGE0_API_URL: ${JUDGE0_API_URL:-https://ce.judge0.com}
      JUDGE0_API_KEY: ${JUDGE0_API_KEY:-}
      JUDGE0_TIMEOUT_SECONDS: "15.0"
      EXECUTION_MOCK_MODE: "false"
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:3000}
      CERTIFICATE_DEV_KEY_AUTOGEN: "true"
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    depends_on:
      - backend
    environment:
      API_BASE_URL: http://backend:8000
    ports:
      - "3000:3000"

volumes:
  postgres_data:
